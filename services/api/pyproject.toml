[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vikram-api"
version = "0.1.0"
description = "Local-first API for the Vikram engineering workspace"
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.139,<0.140",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6.14,<7",
  "python-multipart>=0.0.32,<0.1",
  "uvicorn>=0.51,<0.52",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=9,<10",
  "pytest-cov>=6.2,<7",
  "ruff>=0.15,<0.16",
]

[project.scripts]
vikram-api = "vikram_api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/vikram_api"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "vikram_api/migrations"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["vikram_api"]
